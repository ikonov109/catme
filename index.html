<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CatMe - Защищенный мессенджер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 1000px;
            height: 700px;
            background: white;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }
        .header {
            padding: 20px;
            background: #6d28d9;
            color: white;
            text-align: center;
        }
        .user-info {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6d28d9;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .contacts {
            height: calc(100% - 180px);
            overflow-y: auto;
        }
        .contact {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid #dee2e6;
        }
        .contact:hover { background: #e9ecef; }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            max-width: 70%;
        }
        .message.sent {
            margin-left: auto;
        }
        .message.sent .bubble {
            background: #6d28d9;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        .message.received .bubble {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 18px 18px 18px 4px;
        }
        .bubble {
            padding: 12px 16px;
            word-wrap: break-word;
        }
        .message-input {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #dee2e6;
        }
        .message-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            outline: none;
        }
        .message-input button {
            padding: 12px 24px;
            background: #6d28d9;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .login-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #dee2e6;
            border-radius: 8px;
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            background: #6d28d9;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="header">
                <h1>🐱 CatMe</h1>
            </div>
            <div class="user-info">
                <div class="avatar" id="userAvatar"></div>
                <div>
                    <div id="userName"></div>
                    <small id="userStatus"></small>
                </div>
            </div>
            <div class="contacts" id="contactsList"></div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <h3>Выберите контакт</h3>
            </div>
            <div class="messages" id="messages"></div>
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Сообщение..." disabled>
                <button id="sendButton" disabled>➤</button>
            </div>
        </div>
    </div>

    <div class="login-modal" id="loginModal">
        <div class="login-form">
            <h2>🐱 CatMe</h2>
            <input type="text" id="loginName" placeholder="Имя">
            <input type="password" id="loginPass" placeholder="Пароль (оставьте пустым если новый)">
            <button onclick="login()">Войти</button>
            <p style="margin-top: 10px; font-size: 12px;">Новые аккаунты создаются автоматически</p>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="chat.js"></script>
</body>
</html>
