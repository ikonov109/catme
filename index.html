<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CatMe - Мессенджер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 1000px;
            height: 700px;
            background: white;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            background: #6d28d9;
            color: white;
            text-align: center;
        }
        .user-info {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            border-bottom: 1px solid #dee2e6;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6d28d9;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .contacts {
            flex: 1;
            overflow-y: auto;
        }
        .contact {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid #dee2e6;
        }
        .contact:hover { background: #e9ecef; }
        .contact .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: auto;
        }
        .online { background: #10b981; }
        .offline { background: #9ca3af; }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
            background: white;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            max-width: 70%;
        }
        .message.sent { margin-left: auto; }
        .message.sent .bubble {
            background: #6d28d9;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        .message.received .bubble {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 18px 18px 18px 4px;
        }
        .bubble {
            padding: 12px 16px;
        }
        .message-input {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: white;
            border-top: 1px solid #dee2e6;
        }
        .message-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            outline: none;
        }
        .message-input button {
            padding: 12px 24px;
            background: #6d28d9;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .login-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #dee2e6;
            border-radius: 8px;
        }
        .login-form .btn-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .login-form button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-login { background: #6d28d9; color: white; }
        .btn-register { background: #10b981; color: white; }
        .section {
            padding: 8px 15px;
            background: #e9ecef;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h1>🐱 CatMe</h1>
            </div>
            <div class="user-info">
                <div class="avatar" id="userAvatar">?</div>
                <div>
                    <div id="userName">Гость</div>
                    <small id="userStatus"></small>
                </div>
            </div>
            <div class="contacts" id="contactsList"></div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <h3 id="contactName">Выберите контакт</h3>
            </div>
            <div class="messages" id="messages"></div>
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Сообщение..." disabled>
                <button id="sendButton" disabled>➤</button>
            </div>
        </div>
    </div>

    <div class="login-modal" id="loginModal">
        <div class="login-form">
            <h2>🐱 CatMe</h2>
            <input type="text" id="loginName" placeholder="Имя">
            <input type="password" id="loginPass" placeholder="Пароль">
            <div class="btn-group">
                <button class="btn-login" onclick="login()">Войти</button>
                <button class="btn-register" onclick="register()">Регистрация</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const WS_URL = API_URL.replace('http', 'ws');
        
        let socket = null;
        let currentUser = null;
        let currentContact = null;
        let onlineUsers = new Set();
        let bots = [
            { id: 'cat1', name: 'Мурзик', avatar: '🐱' },
            { id: 'cat2', name: 'Барсик', avatar: '😸' },
            { id: 'cat3', name: 'Рыжик', avatar: '😻' },
            { id: 'cat4', name: 'Снежок', avatar: '❄️' },
            { id: 'cat5', name: 'Василий', avatar: '😼' }
        ];

        function connectWebSocket() {
            socket = new WebSocket(WS_URL);
            socket.onopen = () => {
                if (currentUser) {
                    socket.send(JSON.stringify({
                        type: 'login',
                        userId: currentUser.id,
                        userName: currentUser.name
                    }));
                }
            };
            socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'online') {
                    onlineUsers = new Set(data.users);
                    loadContacts();
                }
                if (data.type === 'message') {
                    if (currentContact && data.from === currentContact.id) {
                        addMessage(data.text, false);
                    }
                }
            };
            socket.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        async function login() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value;
            
            const res = await fetch(API_URL + '/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, password: pass})
            });
            
            if (res.ok) {
                currentUser = await res.json();
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('userName').textContent = currentUser.name;
                document.getElementById('userAvatar').textContent = currentUser.avatar;
                document.getElementById('userStatus').textContent = 'Онлайн';
                connectWebSocket();
                loadContacts();
            } else {
                alert('Ошибка входа');
            }
        }

        async function register() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value;
            
            const res = await fetch(API_URL + '/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, password: pass})
            });
            
            if (res.ok) {
                alert('Аккаунт создан! Теперь войдите');
            } else {
                alert('Ошибка регистрации');
            }
        }

        async function loadContacts() {
            const res = await fetch(API_URL + '/api/users');
            const users = await res.json();
            
            const list = document.getElementById('contactsList');
            list.innerHTML = '';
            
            // Боты
            const botSection = document.createElement('div');
            botSection.className = 'section';
            botSection.textContent = '🤖 БОТЫ';
            list.appendChild(botSection);
            
            bots.forEach(bot => {
                const div = createContactDiv(bot, true);
                list.appendChild(div);
            });
            
            // Онлайн пользователи
            const online = users.filter(u => u.id !== currentUser?.id && onlineUsers.has(u.id));
            if (online.length > 0) {
                const onlineSection = document.createElement('div');
                onlineSection.className = 'section';
                onlineSection.textContent = '🟢 ОНЛАЙН';
                list.appendChild(onlineSection);
                online.forEach(u => {
                    const div = createContactDiv(u, true);
                    list.appendChild(div);
                });
            }
            
            // Остальные
            const offline = users.filter(u => u.id !== currentUser?.id && !onlineUsers.has(u.id));
            if (offline.length > 0) {
                const offlineSection = document.createElement('div');
                offlineSection.className = 'section';
                offlineSection.textContent = '👥 ПОЛЬЗОВАТЕЛИ';
                list.appendChild(offlineSection);
                offline.forEach(u => {
                    const div = createContactDiv(u, false);
                    list.appendChild(div);
                });
            }
        }

        function createContactDiv(user, isOnline) {
            const div = document.createElement('div');
            div.className = 'contact';
            div.onclick = () => selectContact(user);
            div.innerHTML = `
                <div class="avatar">${user.avatar || user.name.charAt(0)}</div>
                <div style="flex:1;">${user.name}</div>
                <div class="dot ${isOnline ? 'online' : 'offline'}"></div>
            `;
            return div;
        }

        function selectContact(contact) {
            currentContact = contact;
            document.getElementById('contactName').textContent = contact.name;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
            loadMessages(contact.id);
        }

        async function loadMessages(contactId) {
            const res = await fetch(API_URL + `/api/messages/${currentUser.id}`);
            const allMessages = await res.json();
            
            const msgs = allMessages.filter(m => 
                m.from === currentUser.id && m.to === contactId ||
                m.from === contactId && m.to === currentUser.id
            );
            
            document.getElementById('messages').innerHTML = '';
            msgs.forEach(m => {
                addMessage(m.text, m.from === currentUser.id);
            });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentContact) return;
            
            const msg = {
                type: 'message',
                from: currentUser.id,
                to: currentContact.id,
                text: text,
                time: Date.now()
            };
            
            socket.send(JSON.stringify(msg));
            addMessage(text, true);
            input.value = '';
        }

        function addMessage(text, isSent) {
            const div = document.createElement('div');
            div.className = `message ${isSent ? 'sent' : 'received'}`;
            div.innerHTML = `<div class="bubble">${text}</div>`;
            document.getElementById('messages').appendChild(div);
        }

        document.getElementById('sendButton').onclick = sendMessage;
        document.getElementById('messageInput').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };
    </script>
</body>
</html>
