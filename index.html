<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CatMe — звонки, группы, HTML</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        .app {
            width: 1000px;
            height: 700px;
            background: white;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            background: #6d28d9;
            color: white;
            text-align: center;
        }
        .user {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6d28d9;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #ccc;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            background: #e9ecef;
            font-weight: bold;
        }
        .tab.active {
            background: white;
        }
        .contacts {
            flex: 1;
            overflow-y: auto;
        }
        .contact {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ccc;
        }
        .contact:hover {
            background: #e9ecef;
        }
        .online {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: auto;
        }
        .online.true { background: #10b981; }
        .online.false { background: #9ca3af; }
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f1f3f5;
        }
        .msg {
            margin-bottom: 15px;
            max-width: 70%;
        }
        .msg.sent {
            margin-left: auto;
        }
        .msg.sent .bubble {
            background: #6d28d9;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        .msg.recv .bubble {
            background: white;
            border: 1px solid #ccc;
            border-radius: 18px 18px 18px 4px;
        }
        .bubble {
            padding: 12px 16px;
            word-wrap: break-word;
        }
        .input {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: white;
            border-top: 1px solid #ccc;
        }
        .input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 25px;
            outline: none;
        }
        .input button {
            padding: 12px 24px;
            background: #6d28d9;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        .attach {
            background: #28a745;
            padding: 12px 20px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
        }
        .login {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .btn-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-login { background: #6d28d9; color: white; }
        .btn-reg { background: #10b981; color: white; }
        .call-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            display: none;
        }
        .call-window video {
            width: 400px;
            height: 300px;
            background: black;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="call-window" id="callWindow">
        <video id="localVideo" autoplay muted></video>
        <video id="remoteVideo" autoplay></video>
        <button onclick="hangup()">Завершить</button>
    </div>

    <div class="app">
        <div class="sidebar">
            <div class="header"><h1>🐱 CatMe</h1></div>
            <div class="user" onclick="showProfile()">
                <div class="avatar" id="myAvatar">?</div>
                <div><span id="myName">Гость</span><br><small id="myStatus"></small></div>
            </div>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('users')">Люди</div>
                <div class="tab" onclick="switchTab('groups')">Группы</div>
                <div class="tab" onclick="switchTab('channels')">Каналы</div>
            </div>
            <div class="contacts" id="contacts"></div>
        </div>
        <div class="chat">
            <div class="chat-header">
                <div class="avatar" id="chatAvatar">🐱</div>
                <div><h3 id="chatName">Выбери чат</h3><small id="chatStatus"></small></div>
                <button onclick="startCall()" id="callBtn" style="display:none;">📹</button>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input">
                <input type="text" id="msgInput" placeholder="Сообщение..." disabled>
                <input type="file" id="fileInput" style="display:none;" onchange="sendFile()">
                <span class="attach" onclick="document.getElementById('fileInput').click()">📎</span>
                <button id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>

    <div class="login" id="login">
        <div class="login-form">
            <h2>🐱 CatMe</h2>
            <input type="text" id="loginName" placeholder="Имя">
            <input type="password" id="loginPass" placeholder="Пароль">
            <div class="btn-group">
                <button class="btn-login" onclick="login()">Войти</button>
                <button class="btn-reg" onclick="register()">Регистрация</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        const WS = API.replace('http', 'ws');

        let socket;
        let me = null;
        let currentChat = null;
        let onlineUsers = new Set();
        let allUsers = [];
        let groups = [];
        let channels = [];
        let currentTab = 'users';

        let pc = null;
        let localStream = null;

        // --- WEB SOCKET ---
        function connectWS() {
            socket = new WebSocket(WS);
            socket.onopen = () => {
                if (me) socket.send(JSON.stringify({ type: 'login', id: me.id }));
            };
            socket.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'online') {
                    onlineUsers = new Set(d.list);
                    renderList();
                    updateChatStatus();
                }
                if (d.type === 'msg') {
                    if (currentChat && (d.msg.chatId === currentChat.id || d.msg.from === currentChat.id || d.msg.to === currentChat.id)) {
                        renderMessage(d.msg);
                    }
                }
                if (d.type === 'call') handleCallOffer(d);
                if (d.type === 'answer') pc?.setRemoteDescription(new RTCSessionDescription(d.answer));
                if (d.type === 'ice') pc?.addIceCandidate(new RTCIceCandidate(d.candidate));
            };
            socket.onclose = () => setTimeout(connectWS, 1000);
        }

        // --- АВТОРИЗАЦИЯ ---
        async function login() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value;
            const res = await fetch(API + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, pass })
            });
            if (!res.ok) return alert('Ошибка входа');
            me = await res.json();
            document.getElementById('login').style.display = 'none';
            document.getElementById('myName').innerText = me.name;
            document.getElementById('myAvatar').innerText = me.avatar;
            document.getElementById('myStatus').innerText = 'Онлайн';
            await loadData();
            connectWS();
        }

        async function register() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value;
            const res = await fetch(API + '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, pass })
            });
            if (res.ok) alert('Регистрация успешна, теперь войди');
            else alert('Ошибка');
        }

        async function loadData() {
            allUsers = await (await fetch(API + '/api/users')).json();
            groups = await (await fetch(API + '/api/groups')).json() || [];
            channels = await (await fetch(API + '/api/channels')).json() || [];
            renderList();
        }

        // --- ОТОБРАЖЕНИЕ КОНТАКТОВ ---
        function renderList() {
            const list = document.getElementById('contacts');
            list.innerHTML = '';

            if (currentTab === 'users') {
                // боты
                const bots = [
                    { id: 'cat1', name: 'Мурзик', avatar: '🐱' },
                    { id: 'cat2', name: 'Барсик', avatar: '😸' },
                    { id: 'cat3', name: 'Рыжик', avatar: '😻' }
                ];
                bots.forEach(b => list.appendChild(contactDiv(b, true)));

                // люди
                allUsers.filter(u => u.id !== me?.id).forEach(u => {
                    list.appendChild(contactDiv(u, onlineUsers.has(u.id)));
                });
            } else if (currentTab === 'groups') {
                groups.forEach(g => list.appendChild(contactDiv(g)));
                list.innerHTML += '<div class="contact" onclick="createGroup()">➕ Создать группу</div>';
            } else if (currentTab === 'channels') {
                channels.forEach(c => list.appendChild(contactDiv(c)));
                list.innerHTML += '<div class="contact" onclick="createChannel()">➕ Создать канал</div>';
            }
        }

        function contactDiv(entity, isOnline = false) {
            const d = document.createElement('div');
            d.className = 'contact';
            d.onclick = () => selectChat(entity);
            d.innerHTML = `
                <div class="avatar">${entity.avatar || entity.name[0]}</div>
                <div style="flex:1">${entity.name}</div>
                <div class="online ${isOnline}"></div>
            `;
            return d;
        }

        async function createGroup() {
            const name = prompt('Название группы');
            if (!name) return;
            const res = await fetch(API + '/api/create-group', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, creator: me.id })
            });
            groups.push(await res.json());
            renderList();
        }

        async function createChannel() {
            const name = prompt('Название канала');
            if (!name) return;
            const res = await fetch(API + '/api/create-channel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, creator: me.id })
            });
            channels.push(await res.json());
            renderList();
        }

        // --- ЧАТ ---
        function selectChat(chat) {
            currentChat = chat;
            document.getElementById('chatName').innerText = chat.name;
            document.getElementById('chatAvatar').innerText = chat.avatar || chat.name[0];
            document.getElementById('chatStatus').innerText = onlineUsers.has(chat.id) ? '🟢 Онлайн' : '⚫ Офлайн';
            document.getElementById('msgInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('callBtn').style.display = (chat.id && !chat.id.startsWith('cat')) ? 'inline' : 'none';
            loadHistory(chat.id);
            document.getElementById('msgInput').focus();
        }

        async function loadHistory(chatId) {
            const res = await fetch(API + `/api/messages/${me.id}/${chatId}`);
            const list = await res.json();
            document.getElementById('messages').innerHTML = '';
            list.forEach(m => renderMessage(m));
        }

        function renderMessage(m) {
            const div = document.createElement('div');
            div.className = `msg ${m.from === me.id ? 'sent' : 'recv'}`;
            if (m.type === 'text' || !m.type) {
                div.innerHTML = `<div class="bubble">${m.data}</div>`;
            } else if (m.type === 'image') {
                div.innerHTML = `<img src="${m.data}" style="max-width:200px; border-radius:10px;">`;
            } else if (m.type === 'audio') {
                div.innerHTML = `<audio controls src="${m.data}" style="width:200px;"></audio>`;
            } else {
                div.innerHTML = `<div class="bubble"><a href="${m.data}" download>📎 файл</a></div>`;
            }
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView();
        }

        function sendMessage() {
            const inp = document.getElementById('msgInput');
            const text = inp.value.trim();
            if (!text || !currentChat) return;
            const msg = {
                type: 'msg',
                from: me.id,
                chatId: currentChat.id,
                data: text
            };
            socket.send(JSON.stringify(msg));
            renderMessage({ from: me.id, to: currentChat.id, data: text });
            inp.value = '';
        }

        function sendFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            if (file.size > 10 * 1024 * 1024) return alert('Файл >10 МБ');

            const reader = new FileReader();
            reader.onload = (e) => {
                let type = 'file';
                if (file.type.startsWith('image/')) type = 'image';
                else if (file.type.startsWith('audio/')) type = 'audio';

                fetch(API + '/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from: me.id,
                        to: currentChat.id,
                        type,
                        data: e.target.result
                    })
                });
            };
            reader.readAsDataURL(file);
            document.getElementById('msgInput').focus();
        }

        // --- ЗВОНКИ ---
        async function startCall() {
            if (!currentChat || !onlineUsers.has(currentChat.id)) return alert('Не в сети');
            document.getElementById('callWindow').style.display = 'block';
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
            pc.onicecandidate = e => {
                if (e.candidate) {
                    socket.send(JSON.stringify({ type: 'ice', candidate: e.candidate, to: currentChat.id }));
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.send(JSON.stringify({ type: 'call', offer, to: currentChat.id }));
        }

        function handleCallOffer(d) {
            if (!confirm('Входящий звонок. Ответить?')) return;
            document.getElementById('callWindow').style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                document.getElementById('localVideo').srcObject = stream;

                pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                stream.getTracks().forEach(t => pc.addTrack(t, stream));
                pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
                pc.onicecandidate = e => {
                    if (e.candidate) {
                        socket.send(JSON.stringify({ type: 'ice', candidate: e.candidate, to: d.from }));
                    }
                };

                pc.setRemoteDescription(new RTCSessionDescription(d.offer));
                pc.createAnswer().then(ans => {
                    pc.setLocalDescription(ans);
                    socket.send(JSON.stringify({ type: 'answer', answer: ans, to: d.from }));
                });
            });
        }

        function hangup() {
            if (pc) pc.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('callWindow').style.display = 'none';
        }

        // --- ВСПОМОГАТЕЛЬНОЕ ---
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderList();
        }

        function updateChatStatus() {
            if (currentChat) {
                document.getElementById('chatStatus').innerText = onlineUsers.has(currentChat.id) ? '🟢 Онлайн' : '⚫ Офлайн';
            }
        }

        function showProfile() {
            document.getElementById('messages').innerHTML = `
                <div style="text-align:center;padding:50px">
                    <h2>${me.name}</h2>
                    <p>ID: ${me.id}</p>
                    <p>Статус: онлайн</p>
                </div>
            `;
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('msgInput').onkeypress = e => {
            if (e.key === 'Enter') sendMessage();
        };
        document.getElementById('msgInput').addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    document.getElementById('fileInput').files = new FileList([file]);
                    sendFile();
                    e.preventDefault();
                }
            }
        });

        // автоматический вход для теста (убери если надо)
        // setTimeout(() => {
        //     document.getElementById('loginName').value = 'test';
        //     document.getElementById('loginPass').value = '123';
        //     login();
        // }, 100);
    </script>
</body>
</html>
