<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CatMe — милый мессенджер</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        .app {
            width: 1000px;
            height: 700px;
            background: white;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            background: #6d28d9;
            color: white;
            text-align: center;
        }
        .user {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6d28d9;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .contacts {
            flex: 1;
            overflow-y: auto;
        }
        .contact {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ccc;
        }
        .contact:hover { background: #e9ecef; }
        .online {
            width: 10px; height: 10px; border-radius: 50%; margin-left: auto;
        }
        .online.true { background: #10b981; }
        .online.false { background: #9ca3af; }
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f1f3f5;
        }
        .msg {
            margin-bottom: 15px;
            max-width: 70%;
        }
        .msg.sent { margin-left: auto; }
        .msg.sent .bubble {
            background: #6d28d9;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        .msg.recv .bubble {
            background: white;
            border: 1px solid #ccc;
            border-radius: 18px 18px 18px 4px;
        }
        .bubble { padding: 12px 16px; word-wrap: break-word; }
        .input {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: white;
            border-top: 1px solid #ccc;
        }
        .input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 25px;
            outline: none;
        }
        .input button {
            padding: 12px 24px;
            background: #6d28d9;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        .login {
            position: absolute; top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .btn-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-login { background: #6d28d9; color: white; }
        .btn-reg { background: #10b981; color: white; }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="header"><h1>🐱 CatMe</h1></div>
            <div class="user" onclick="showProfile()">
                <div class="avatar" id="myAvatar">?</div>
                <div><span id="myName">Гость</span><br><small id="myStatus"></small></div>
            </div>
            <div class="contacts" id="contacts"></div>
        </div>
        <div class="chat">
            <div class="chat-header">
                <div class="avatar" id="chatAvatar">🐱</div>
                <div><h3 id="chatName">Выбери чат</h3><small id="chatStatus"></small></div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input">
                <input type="text" id="msgInput" placeholder="Сообщение...">
                <button id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <div class="login" id="login">
        <div class="login-form">
            <h2>🐱 CatMe</h2>
            <input type="text" id="loginName" placeholder="Имя">
            <input type="password" id="loginPass" placeholder="Пароль">
            <div class="btn-group">
                <button class="btn-login" onclick="login()">Войти</button>
                <button class="btn-reg" onclick="register()">Регистрация</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        const WS = API.replace('http', 'ws');

        let socket, me, chat, online = new Set(), users = [];

        // ===== АВАРИЙНОЕ ВКЛЮЧЕНИЕ ПОЛЯ (каждую секунду) =====
        setInterval(() => {
            const inp = document.getElementById('msgInput');
            if (inp) {
                inp.disabled = false;
            }
        }, 1000);

        function connect() {
            socket = new WebSocket(WS);
            socket.onopen = () => {
                if (me) socket.send(JSON.stringify({ type: 'login', id: me.id, name: me.name }));
            };
            socket.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'online') {
                    online = new Set(d.list);
                    renderContacts();
                    if (chat) updateStatus();
                }
                if (d.type === 'msg') {
                    if (chat && (d.msg.from === chat.id || d.msg.to === chat.id)) {
                        renderMessage(d.msg);
                    }
                }
            };
            socket.onclose = () => setTimeout(connect, 1000);
        }

        async function login() {
            const n = document.getElementById('loginName').value.trim();
            const p = document.getElementById('loginPass').value;
            const res = await fetch(API + '/api/login', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ name:n, pass:p })
            });
            if (!res.ok) return alert('Ошибка');
            me = await res.json();
            document.getElementById('login').style.display = 'none';
            document.getElementById('myName').innerText = me.name;
            document.getElementById('myAvatar').innerText = me.avatar;
            document.getElementById('myStatus').innerText = 'Онлайн';
            await loadUsers();
            connect();
        }

        async function register() {
            const n = document.getElementById('loginName').value.trim();
            const p = document.getElementById('loginPass').value;
            const res = await fetch(API + '/api/register', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ name:n, pass:p })
            });
            if (res.ok) alert('Ок, теперь войди'); else alert('Ошибка');
        }

        async function loadUsers() {
            users = await (await fetch(API + '/api/users')).json();
            renderContacts();
        }

        function renderContacts() {
            const list = document.getElementById('contacts');
            list.innerHTML = '';

            [{id:'cat1',name:'Мурзик',avatar:'🐱'},{id:'cat2',name:'Барсик',avatar:'😸'},{id:'cat3',name:'Рыжик',avatar:'😻'}]
                .forEach(b => list.appendChild(contactDiv(b, true)));

            users.filter(u => u.id !== me?.id).forEach(u => {
                list.appendChild(contactDiv(u, online.has(u.id)));
            });
        }

        function contactDiv(u, on) {
            const d = document.createElement('div');
            d.className = 'contact';
            d.onclick = () => selectChat(u);
            d.innerHTML = `<div class="avatar">${u.avatar}</div><div style="flex:1">${u.name}</div><div class="online ${on}"></div>`;
            return d;
        }

        function selectChat(u) {
            chat = u;
            
            document.getElementById('msgInput').disabled = false;
            document.getElementById('msgInput').focus();
            document.getElementById('sendBtn').disabled = false;
            
            document.getElementById('chatName').innerText = u.name;
            document.getElementById('chatAvatar').innerText = u.avatar;
            document.getElementById('chatStatus').innerText = online.has(u.id) ? '🟢 Онлайн' : '⚫ Офлайн';
            loadHistory(u.id);
        }

        async function loadHistory(id) {
            const res = await fetch(API + `/api/messages/${me.id}/${id}`);
            const list = await res.json();
            document.getElementById('messages').innerHTML = '';
            list.forEach(m => renderMessage(m));
        }

        function renderMessage(m) {
            const div = document.createElement('div');
            div.className = `msg ${m.from === me.id ? 'sent' : 'recv'}`;
            div.innerHTML = `<div class="bubble">${m.data}</div>`;
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView();
        }

        function sendMessage() {
            const inp = document.getElementById('msgInput');
            const text = inp.value.trim();
            if (!text || !chat || !socket) return;

            const msg = {
                type: 'msg',
                from: me.id,
                to: chat.id,
                data: text
            };
            socket.send(JSON.stringify(msg));
            renderMessage({ from: me.id, to: chat.id, data: text });
            inp.value = '';
            inp.focus();
        }

        function updateStatus() {
            if (chat) document.getElementById('chatStatus').innerText = online.has(chat.id) ? '🟢 Онлайн' : '⚫ Офлайн';
        }

        function showProfile() {
            document.getElementById('messages').innerHTML = `<div style="text-align:center;padding:50px"><h2>${me.name}</h2><p>ID: ${me.id}</p></div>`;
        }

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('msgInput').onkeypress = e => e.key === 'Enter' && sendMessage();
    </script>
    // Жёсткая фиксация фокуса
let forcedInput = document.getElementById('msgInput');
if (forcedInput) {
    forcedInput.addEventListener('blur', (e) => {
        setTimeout(() => {
            if (chat) forcedInput.focus();
        }, 10);
    });
}
</body>
</html>
