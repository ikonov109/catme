<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CatMe</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        .app {
            width: 1000px;
            height: 700px;
            background: white;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 20px;
            background: #6d28d9;
            color: white;
            text-align: center;
        }
        .user {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ccc;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6d28d9;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .contacts {
            flex: 1;
            overflow-y: auto;
        }
        .contact {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ccc;
        }
        .contact:hover { background: #e9ecef; }
        .online { width:10px; height:10px; border-radius:50%; margin-left:auto; }
        .online.true { background:#10b981; }
        .online.false { background:#9ca3af; }
        .chat {
            flex:1;
            display:flex;
            flex-direction:column;
        }
        .chat-header {
            padding:20px;
            border-bottom:1px solid #ccc;
            display:flex;
            align-items:center;
            gap:15px;
        }
        .messages {
            flex:1;
            padding:20px;
            overflow-y:auto;
            background:#f1f3f5;
        }
        .msg {
            margin-bottom:15px;
            max-width:70%;
        }
        .msg.sent { margin-left:auto; }
        .msg.sent .bubble { background:#6d28d9; color:white; border-radius:18px 18px 4px 18px; }
        .msg.recv .bubble { background:white; border:1px solid #ccc; border-radius:18px 18px 18px 4px; }
        .bubble { padding:12px 16px; }
        .input {
            padding:20px;
            display:flex;
            gap:10px;
            background:white;
            border-top:1px solid #ccc;
        }
        .input input {
            flex:1;
            padding:12px;
            border:2px solid #ccc;
            border-radius:25px;
            outline:none;
        }
        .input button {
            padding:12px 24px;
            background:#6d28d9;
            color:white;
            border:none;
            border-radius:25px;
            cursor:pointer;
        }
        .attach {
            background:#28a745;
            padding:12px 20px;
            border-radius:25px;
            color:white;
            cursor:pointer;
        }
        .login {
            position:absolute;
            top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.9);
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .login-form {
            background:white;
            padding:40px;
            border-radius:20px;
            width:350px;
            text-align:center;
        }
        .login-form input {
            width:100%;
            padding:12px;
            margin:10px 0;
            border:2px solid #ccc;
            border-radius:8px;
        }
        .btn-group {
            display:flex;
            gap:10px;
            margin:20px 0;
        }
        .btn-group button {
            flex:1;
            padding:12px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }
        .btn-login { background:#6d28d9; color:white; }
        .btn-reg { background:#10b981; color:white; }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="header"><h1>🐱 CatMe</h1></div>
            <div class="user">
                <div class="avatar" id="myAvatar">?</div>
                <div><div id="myName">Гость</div><small id="myStatus"></small></div>
            </div>
            <div class="contacts" id="contacts"></div>
        </div>
        <div class="chat">
            <div class="chat-header">
                <div class="avatar" id="chatAvatar">🐱</div>
                <div><h3 id="chatName">Выбери чат</h3><small id="chatStatus"></small></div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input">
                <input type="text" id="msgInput" placeholder="Сообщение..." disabled>
                <input type="file" id="fileInput" style="display:none;" onchange="sendFile()">
                <span class="attach" onclick="document.getElementById('fileInput').click()">📎</span>
                <button id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>

    <div class="login" id="login">
        <div class="login-form">
            <h2>🐱 CatMe</h2>
            <input type="text" id="loginName" placeholder="Имя">
            <input type="password" id="loginPass" placeholder="Пароль">
            <div class="btn-group">
                <button class="btn-login" onclick="login()">Войти</button>
                <button class="btn-reg" onclick="reg()">Регистрация</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        const WS = API.replace('http', 'ws');

        let socket, me, chat, online = new Set(), users = [];

        function connect() {
            socket = new WebSocket(WS);
            socket.onopen = () => socket.send(JSON.stringify({ type: 'login', id: me.id }));
            socket.onmessage = e => {
                const d = JSON.parse(e.data);
                if (d.type === 'online') { online = new Set(d.list); loadContacts(); }
                if (d.type === 'msg') {
                    if (chat && (d.msg.from === chat.id || d.msg.to === chat.id)) addMsg(d.msg);
                }
            };
            socket.onclose = () => setTimeout(connect, 2000);
        }

        async function login() {
            const n = document.getElementById('loginName').value.trim();
            const p = document.getElementById('loginPass').value;
            const r = await fetch(API + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:n, pass:p}) });
            if (!r.ok) return alert('Неверно');
            me = await r.json();
            document.getElementById('login').style.display = 'none';
            document.getElementById('myName').innerText = me.name;
            document.getElementById('myAvatar').innerText = me.avatar;
            document.getElementById('myStatus').innerText = 'Онлайн';
            await loadUsers();
            connect();
        }

        async function reg() {
            const n = document.getElementById('loginName').value.trim();
            const p = document.getElementById('loginPass').value;
            const r = await fetch(API + '/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:n, pass:p}) });
            if (r.ok) alert('Ок, теперь войди'); else alert('Ошибка');
        }

        async function loadUsers() {
            const r = await fetch(API + '/api/users');
            users = await r.json();
            loadContacts();
        }

        function loadContacts() {
            const list = document.getElementById('contacts');
            list.innerHTML = '';
            [{id:'cat1',name:'Мурзик',avatar:'🐱'},{id:'cat2',name:'Барсик',avatar:'😸'},{id:'cat3',name:'Рыжик',avatar:'😻'}].forEach(b => {
                list.appendChild(contactDiv(b, true));
            });
            users.filter(u => u.id !== me.id).forEach(u => {
                list.appendChild(contactDiv(u, online.has(u.id)));
            });
        }

        function contactDiv(u, on) {
            const d = document.createElement('div');
            d.className = 'contact';
            d.onclick = () => selectChat(u);
            d.innerHTML = `<div class="avatar">${u.avatar}</div><div style="flex:1">${u.name}</div><div class="online ${on}"></div>`;
            return d;
        }

        function selectChat(u) {
            chat = u;
            document.getElementById('chatName').innerText = u.name;
            document.getElementById('chatAvatar').innerText = u.avatar;
            document.getElementById('chatStatus').innerText = online.has(u.id) ? '🟢 Онлайн' : '⚫ Офлайн';
            document.getElementById('msgInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            loadHistory(u.id);
        }

        async function loadHistory(id) {
            const r = await fetch(API + `/api/messages/${me.id}/${id}`);
            const list = await r.json();
            document.getElementById('messages').innerHTML = '';
            list.forEach(m => addMsg(m));
        }

        function addMsg(m) {
            if (!chat) return;
            const div = document.createElement('div');
            div.className = `msg ${m.from === me.id ? 'sent' : 'recv'}`;
            div.innerHTML = `<div class="bubble">${m.data}</div>`;
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView();
        }

        function sendMsg() {
            const inp = document.getElementById('msgInput');
            const t = inp.value.trim();
            if (!t || !chat) return;
            socket.send(JSON.stringify({ type:'msg', from:me.id, to:chat.id, data:t }));
            addMsg({ from:me.id, to:chat.id, data:t });
            inp.value = '';
        }

        function sendFile() {
            const f = document.getElementById('fileInput').files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (e) => {
                fetch(API + '/api/upload', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ from:me.id, to:chat.id, type:'file', data:e.target.result })
                });
                addMsg({ from:me.id, to:chat.id, data:'📎 Файл отправлен' });
                document.getElementById('msgInput').focus();
            };
            r.readAsDataURL(f);
        }

        document.getElementById('sendBtn').onclick = sendMsg;
        document.getElementById('msgInput').onkeypress = e => e.key === 'Enter' && sendMsg();
    </script>
</body>
</html>
